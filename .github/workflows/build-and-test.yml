name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    secrets: inherit

  # The unit suite runs on the JVM without a game. That cannot catch the failures that only appear
  # at mod-load time: an Access Transformer that stopped matching, a @Mod annotation change, a
  # dependency that is no longer satisfied, an API method CC renamed. This job boots a real
  # dedicated dev server, lets it stop itself (scripts/headless-smoke.sh + -PsmokeTest) and asserts
  # on its log.
  headless-smoke:
    name: Headless server smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-smoke-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'dependencies.gradle', 'settings.gradle.kts') }}
          restore-keys: |
            gradle-smoke-${{ runner.os }}-

      - name: Boot a dedicated server and assert on its log
        # The server is told to stop ~10s after FML reports "Done"; SMOKE_STOP_AFTER is only the
        # fallback for when the log cannot be read while log4j holds it open.
        env:
          SMOKE_STOP_AFTER: 120
        run: bash scripts/headless-smoke.sh

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-smoke-logs
          path: |
            build/smoke-gradle.log
            run/server/logs/
          retention-days: 7
